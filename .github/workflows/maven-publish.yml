name: Maven Build and Publish

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
    paths:
      - pom.xml
      - src/**
      - .github/workflows/maven-publish.yml
  pull_request:
    branches:
      - master
      - main
    paths:
      - pom.xml
      - src/**
      - .github/workflows/maven-publish.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maven-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify -Dgpg.skip=true

  publish:
    name: Deploy to Maven Central
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
      MAVEN_TOKEN: ${{ secrets.MAVEN_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure required Maven secrets are set
        run: |
          test -n "${MAVEN_USERNAME}" || (echo "Missing secret: MAVEN_USERNAME" && exit 1)
          test -n "${MAVEN_TOKEN}" || (echo "Missing secret: MAVEN_TOKEN" && exit 1)

      - name: Set up Java and Maven server credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: ossrh-bithatch
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Import GPG key (optional)
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ env.GPG_PRIVATE_KEY }}
          passphrase: ${{ env.GPG_PASSPHRASE }}

      - name: Deploy
        run: |
          GPG_FLAGS="-Dgpg.skip=true"
          if [ -n "${GPG_PRIVATE_KEY}" ]; then
            GPG_FLAGS=""
          fi
          mvn --batch-mode --no-transfer-progress deploy -DskipTests ${GPG_FLAGS}
